# =============================================================================
# NGINX CONFIG (for production)
# =============================================================================
# Reverse proxy that sits in front of your API.
# Handles: SSL, load balancing, static files, caching.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Upstream - your API server(s)
    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # API requests
        location /api {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            proxy_pass http://api;
        }

        # Docs (remove in production if you don't want public docs)
        location /docs {
            proxy_pass http://api;
        }

        location /openapi.json {
            proxy_pass http://api;
        }

        # Admin panel
        location /admin {
            alias /usr/share/nginx/html/admin;
            try_files $uri $uri/ /admin/index.html;
        }
    }
}
